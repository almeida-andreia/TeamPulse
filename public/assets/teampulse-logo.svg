<svg xmlns="http://www.w3.org/2000/svg" width="230" height="192" viewBox="0 0 230 192" role="img" aria-labelledby="title description">
  <title id="title">TeamPulse — Listen. Understand. Support.</title>
  <desc id="description">Vector reconstruction of the supplied TeamPulse mockup: five people linked in a blue and sage circle, with the original wordmark and tagline.</desc>
  <!-- The mark view lets the shared application shell keep its existing live
       wordmark/tagline and layout. The default view is the complete lockup.
       Reference: teampulse-brand-reference.png, original mark at (96,62).
       All geometry is vector; no embedded bitmap, filter or external resource. -->
  <view id="mark" viewBox="45 0 140 136"/>
  <defs>
    <!-- Traced outer silhouette and five-lobed negative space, rather than a
         generic circular ring. The five overlapping bodies share this contour. -->
    <clipPath id="linked-silhouette" clipPathUnits="userSpaceOnUse">
      <path clip-rule="evenodd" fill-rule="evenodd" d="M70 17C100 17 125 39 127 67C129 96 107 124 79 128C51 132 23 116 16 88C7 61 22 31 48 21C55 18 63 17 70 17Z M71 40C65 40 59 36 52 39C43 41 40 46 39 53C38 62 32 66 33 74C33 84 39 89 46 92C53 94 58 98 63 105C68 112 72 112 77 109C81 105 83 101 89 97C94 94 99 93 103 89C109 84 106 78 103 73C100 67 101 63 101 58C101 50 97 46 91 42C85 36 79 38 71 40Z"/>
    </clipPath>
    <linearGradient id="linked-base" x1="14" y1="48" x2="127" y2="83" gradientUnits="userSpaceOnUse">
      <stop stop-color="#91b7c7"/><stop offset=".52" stop-color="#c1d8cd"/><stop offset="1" stop-color="#90bbab"/>
    </linearGradient>
    <linearGradient id="upper-right" x1="64" y1="19" x2="124" y2="61" gradientUnits="userSpaceOnUse">
      <stop stop-color="#a9c5c9"/><stop offset="1" stop-color="#b6d4c3"/>
    </linearGradient>
    <linearGradient id="right" x1="122" y1="49" x2="98" y2="120" gradientUnits="userSpaceOnUse">
      <stop stop-color="#77a997"/><stop offset="1" stop-color="#b4d1c3"/>
    </linearGradient>
    <linearGradient id="lower" x1="106" y1="113" x2="35" y2="112" gradientUnits="userSpaceOnUse">
      <stop stop-color="#b4d1c2"/><stop offset="1" stop-color="#90b8b2"/>
    </linearGradient>
    <linearGradient id="left" x1="21" y1="53" x2="42" y2="116" gradientUnits="userSpaceOnUse">
      <stop stop-color="#77a3bb"/><stop offset="1" stop-color="#b5cfcb"/>
    </linearGradient>
    <linearGradient id="upper-left" x1="16" y1="56" x2="71" y2="22" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9bbbc9"/><stop offset="1" stop-color="#c3d6d9"/>
    </linearGradient>
    <linearGradient id="head-blue" x1="0" y1="0" x2="0.7" y2="1">
      <stop stop-color="#77a3bf"/><stop offset="1" stop-color="#4d7c9e"/>
    </linearGradient>
    <linearGradient id="head-teal" x1="0" y1="0" x2="0.8" y2="1">
      <stop stop-color="#83b2a0"/><stop offset="1" stop-color="#629d8e"/>
    </linearGradient>
    <linearGradient id="head-sage" x1="0" y1="0" x2="0.8" y2="1">
      <stop stop-color="#b5d2c5"/><stop offset="1" stop-color="#8ab9a9"/>
    </linearGradient>
    <linearGradient id="head-mist" x1="0" y1="0" x2="0.8" y2="1">
      <stop stop-color="#aecbca"/><stop offset="1" stop-color="#82b0ae"/>
    </linearGradient>
  </defs>
  <g transform="translate(45)" id="people-circle">
    <!-- Five interlocking curved silhouettes retain the open, organic centre. -->
    <g clip-path="url(#linked-silhouette)">
      <path fill="url(#linked-base)" d="M0 0H140V136H0Z"/>
      <path fill="url(#upper-left)" d="M17 54C17 32 35 20 49 20C59 18 62 28 69 33C74 37 79 38 85 39C75 44 62 44 52 37C44 34 39 44 38 54C36 67 24 72 18 63Z"/>
      <path fill="url(#upper-right)" fill-opacity=".7" d="M46 20C63 12 92 17 110 33C123 45 127 54 127 65L103 63C101 48 91 36 80 39C66 44 55 30 46 20Z"/>
      <path fill="url(#right)" fill-opacity=".85" d="M118 45C130 49 132 72 123 93C118 103 110 113 102 118C99 107 95 107 89 106C92 96 104 92 106 84C109 75 98 71 101 58C102 50 108 45 118 45Z"/>
      <path fill="url(#left)" d="M20 52C27 53 37 53 39 62C38 69 31 75 33 82C34 90 43 91 50 96C41 100 35 107 35 114C21 101 12 82 15 66Z"/>
      <path fill="url(#lower)" fill-opacity=".85" d="M31 105C34 95 45 94 53 100C64 107 67 120 85 125C72 131 50 125 37 118Z"/>
      <path fill="url(#lower)" fill-opacity=".6" d="M105 90C94 96 81 100 75 112C68 124 55 126 52 125C70 131 89 129 104 120C111 113 110 99 105 90Z"/>
    </g>
    <ellipse cx="70.5" cy="17" rx="13" ry="13.5" fill="url(#head-blue)"/>
    <ellipse cx="123.5" cy="54.5" rx="13" ry="13" fill="url(#head-teal)"/>
    <ellipse cx="101" cy="116" rx="13" ry="13" fill="url(#head-sage)"/>
    <ellipse cx="39" cy="116" rx="13" ry="13" fill="url(#head-mist)"/>
    <ellipse cx="17" cy="54.5" rx="13" ry="13" fill="url(#head-blue)"/>
  </g>
  <g text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">
    <text x="115" y="166" font-size="32" font-weight="650" fill="#659f8e">TeamPulse</text>
    <text x="115" y="187" font-size="12" font-style="italic" fill="#737b83">Listen. Understand. Support.</text>
  </g>
</svg>
